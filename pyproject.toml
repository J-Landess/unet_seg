[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unet-semantic-segmentation"
version = "0.1.0"
description = "A comprehensive U-Net implementation for semantic segmentation with BDD100K and KITTI support"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
license = {text = "MIT"}
keywords = ["computer-vision", "semantic-segmentation", "unet", "pytorch", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    # Core PyTorch
    "torch>=1.12.0",
    "torchvision>=0.13.0",
    "torchaudio>=0.12.0",
    "pytorch-lightning>=1.8.0",
    
    # Computer Vision
    "opencv-python>=4.6.0",
    "numpy>=1.21.0",
    "Pillow>=9.0.0",
    "albumentations>=1.2.0",
    
    # Data handling
    "pandas>=1.4.0",
    "pycocotools>=2.0.4",
    
    # Visualization
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "plotly>=5.10.0",
    "wandb>=0.13.0",
    
    # Video processing
    "imageio>=2.19.0",
    "imageio-ffmpeg>=0.4.7",
    
    # Utilities
    "tqdm>=4.64.0",
    "pyyaml>=6.0",
    "tensorboard>=2.9.0",
    "scikit-learn>=1.1.0",
    "scipy>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=2.20.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/unet-semantic-segmentation"
Repository = "https://github.com/yourusername/unet-semantic-segmentation"
Documentation = "https://github.com/yourusername/unet-semantic-segmentation#readme"
"Bug Tracker" = "https://github.com/yourusername/unet-semantic-segmentation/issues"

[project.scripts]
unet-train = "unet.cli:train_main"
unet-infer = "unet.cli:infer_main"
unet-evaluate = "unet.cli:evaluate_main"
unet-setup = "unet.cli:setup_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py39"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
