# DeepSORT with PyTorch Configuration

# Project settings
project:
  name: "deepsort_pytorch"
  version: "1.0.0"
  description: "DeepSORT multi-object tracking with YOLOv8 and PyTorch Lightning"

# Model settings
model:
  detector:
    name: "yolov8"
    weights: "yolov8n.pt"  # yolov8n.pt, yolov8s.pt, yolov8m.pt, yolov8l.pt, yolov8x.pt
    input_size: [640, 640]
    conf_threshold: 0.5
    nms_threshold: 0.4
    max_det: 1000
    
  tracker:
    name: "deepsort"
    max_cosine_distance: 0.2
    nn_budget: 100
    max_iou_distance: 0.7
    max_age: 70
    n_init: 3

# Training settings
training:
  batch_size: 16
  num_epochs: 100
  learning_rate: 0.001
  weight_decay: 1e-4
  warmup_epochs: 5
  scheduler: "cosine"
  early_stopping_patience: 10
  gradient_clip_val: 1.0
  
  # YOLO fine-tuning
  freeze_backbone: false
  freeze_neck: false
  freeze_head: false
  
  # Data augmentation
  augmentation:
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4
    degrees: 0.0
    translate: 0.1
    scale: 0.5
    shear: 0.0
    perspective: 0.0
    flipud: 0.0
    fliplr: 0.5
    mosaic: 1.0
    mixup: 0.0

# Dataset settings
dataset:
  name: "kitti"  # kitti, nuscenes, custom
  root_dir: "data/"
  train_split: "train"
  val_split: "val"
  test_split: "test"
  
  # KITTI specific
  kitti:
    images_dir: "data/kitti/training/image_02"
    labels_dir: "data/kitti/training/label_02"
    sequences: ["0000", "0001", "0002", "0003", "0004", "0005", "0006", "0007", "0008", "0009", "0010", "0011", "0012", "0013", "0014", "0015", "0016", "0017", "0018", "0019", "0020"]
    
  # nuScenes specific
  nuscenes:
    data_path: "data/nuscenes"
    version: "v1.0-trainval"
    
  # Custom dataset
  custom:
    images_dir: "data/custom/images"
    labels_dir: "data/custom/labels"
    classes: ["car", "truck", "bus", "motorcycle", "bicycle", "person"]

# Evaluation settings
evaluation:
  metrics: ["mota", "idf1", "mt", "ml", "fp", "fn", "ids", "frag"]
  iou_threshold: 0.5
  min_track_length: 3
  
  # Output settings
  save_tracks: true
  save_videos: true
  save_images: false
  output_format: "mot"

# Logging settings
logging:
  log_level: "INFO"
  log_dir: "logs/"
  save_dir: "outputs/"
  
  # TensorBoard
  tensorboard: true
  
  # Weights & Biases
  wandb:
    enabled: false
    project: "deepsort-pytorch"
    entity: "your-username"

# Hardware settings
hardware:
  device: "auto"  # auto, cpu, cuda, mps
  num_workers: 4
  pin_memory: true
  mixed_precision: true