name: unet-semantic-segmentation
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  # Python version
  - python=3.10
  
  # Core Deep Learning Framework (from PyTorch channel for better compatibility)
  - pytorch>=2.3.0
  - torchvision>=0.18.0
  # - pytorch-cuda=11.8  # Uncomment for CUDA support (Linux/Windows only)
  
  # Computer Vision and Image Processing
  - opencv>=4.10.0
  - pillow>=11.0.0
  
  # Numerical Computing
  - numpy>=1.26.0
  
  # Data Visualization
  - matplotlib>=3.9.0
  - seaborn>=0.13.0
  
  # Machine Learning
  - scikit-learn>=1.6.0
  
  # Configuration
  - pyyaml>=6.0
  
  # System utilities
  - pip
  - pip:
      # Data Augmentation (better from pip for latest features)
      - albumentations>=1.3.0
      
      # Progress and Utilities
      - tqdm>=4.65.0
      
      # Experiment Tracking and Logging
      - tensorboard>=2.13.0
      - wandb>=0.15.0
      
      # Dataset Download and Processing
      - requests>=2.28.0
      
      # Video Processing (optional)
      # - ffmpeg-python>=0.2.0
      
      # Development and Testing (optional)
      # - pytest>=7.0.0
      # - jupyter>=1.0.0
      # - ipython>=8.0.0
